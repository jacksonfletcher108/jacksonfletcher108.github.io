<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Date Night</title>
  <meta name="description" content="Pick our next Charleston date.">
  <meta name="theme-color" content="#0a0909">

  <!-- iPhone home-screen app settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Date Night">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
  <div class="app">

    <!-- ============ PICK ============ -->
    <main class="screen" id="screen-pick">
      <header class="large-title">
        <p class="kicker" id="today"></p>
        <h1>Date Night</h1>
        <p class="weather" id="weather" hidden></p>
      </header>

      <div class="rain-banner" id="rain-banner" hidden></div>

      <section>
        <div class="section-head"><h2 class="section-label">Quick picks</h2></div>
        <div class="presets" id="presets"></div>
      </section>

      <section>
        <div class="section-head">
          <h2 class="section-label">Filters</h2>
          <button class="text-btn" id="clear-filters" hidden>Reset</button>
        </div>
        <div class="group filters" id="filter-rows"></div>
      </section>

      <div class="pick-bar">
        <button class="btn btn-primary btn-lg" id="pick-btn">Pick a date</button>
        <p class="pick-count" id="pick-count"></p>
      </div>
    </main>

    <!-- ============ BROWSE ============ -->
    <main class="screen" id="screen-browse" hidden>
      <header class="large-title title-row">
        <div>
          <p class="kicker" id="browse-count"></p>
          <h1>Browse</h1>
        </div>
        <button class="btn btn-secondary btn-sm" id="add-idea" data-icon="plus">Add idea</button>
      </header>
      <div class="browse-tools">
        <input class="search" id="browse-q" type="search" placeholder="Search ideas, places, neighborhoods" autocomplete="off" aria-label="Search ideas">
        <div class="seg" id="browse-tier" role="group" aria-label="Setting"></div>
      </div>
      <div id="browse-list"></div>
    </main>

    <!-- ============ SAVED ============ -->
    <main class="screen" id="screen-saved" hidden>
      <header class="large-title title-row">
        <div>
          <p class="kicker">For another night</p>
          <h1>Saved</h1>
        </div>
        <button class="btn btn-secondary btn-sm sync-btn" data-icon="sync">Sync</button>
      </header>
      <div id="saved-list"></div>
    </main>

    <!-- ============ HISTORY ============ -->
    <main class="screen" id="screen-history" hidden>
      <header class="large-title title-row">
        <div>
          <p class="kicker" id="month-label"></p>
          <h1>History</h1>
        </div>
        <button class="btn btn-secondary btn-sm sync-btn" data-icon="sync">Sync</button>
      </header>
      <div class="group stats" id="stats"></div>
      <p class="footnote" id="cheer"></p>
      <div id="history-list"></div>
    </main>

    <!-- ============ TAB BAR ============ -->
    <nav class="tabbar" aria-label="Main">
      <button class="tab active" data-tab="pick" data-icon="shuffle">Pick</button>
      <button class="tab" data-tab="browse" data-icon="list">Browse</button>
      <button class="tab" data-tab="saved" data-icon="bookmark">Saved</button>
      <button class="tab" data-tab="history" data-icon="clock">History</button>
    </nav>
  </div>

  <!-- ============ RESULT ============ -->
  <div class="overlay" id="result" hidden>
    <header class="nav">
      <button class="icon-btn" id="close-result" aria-label="Close" data-icon="x"></button>
      <span class="nav-title">Tonight's pick</span>
      <button class="icon-btn" id="share-idea" aria-label="Share this idea" data-icon="share"></button>
    </header>
    <div class="result-body">
      <article class="card" id="card"></article>
    </div>
    <footer class="result-actions">
      <button class="btn btn-secondary" id="act-reroll" data-icon="repeat">Reroll</button>
      <button class="btn btn-secondary btn-square" id="act-save" aria-label="Save for later" data-icon="bookmark"></button>
      <button class="btn btn-green" id="act-done" data-icon="check">We did it</button>
    </footer>
  </div>

  <!-- ============ BOTTOM SHEET ============ -->
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>

  <div class="toast" id="toast" aria-live="polite"></div>

  <script src="ideas.js"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
